name: wf-develop-deploy
on:
  push:
    branches:
      - develop
jobs:
  develop-pr-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
      - name: Build Websitew with Parcel
        run: |
         npx parcel build "./src/index.html" --dist-dir "./dev"  --public-url "./"
      - name: Upload Build Artifact
        uses: actions/upload-pages-artifact@v3
        with: 
          path: "./dev"
          name: "develop-artifact"
  develop-deploy-job:
    needs: "develop-build-job"
    environment: "development-env"
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Artifacts on GH pages
        uses: Actions/deploy-pages@v4
        with:
          artifact_name: "develop-artifact"
          token: $((github.token))

          




          
  

  